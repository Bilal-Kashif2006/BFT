<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404</title>
  </head>
  <body>
    <script>
      // Check if the URL doesn't already end with .html
      if (!window.location.pathname.endsWith('.html')) {
        // Redirect to the URL with .html appended to it
        window.location.replace(window.location.pathname + ".html");
      }
    </script>
  </body>
</html>
